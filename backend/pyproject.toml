[project]
name = "ledgerdrop-backend"
version = "0.1.0"
description = "LedgerDrop backend - business document processing (Stage 2: upload foundation)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "anyio>=4.6",
    "pypdf>=5.1",
    "openai>=1.109",
    "aioboto3>=15.5.0",
    "slowapi>=0.1.10",
    "sentry-sdk>=2.69.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # Alembic's `timezone = UTC` (alembic.ini) needs IANA tz data, which Windows
    # does not ship. Only used when rendering migration timestamps.
    "tzdata>=2024.1",
    "moto[s3,server]>=5.2.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
