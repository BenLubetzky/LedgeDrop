# Local production-LIKE stack (Stage 9, Package 3). Verification only - this is
# never the deploy mechanism.
#
#   docker compose -f docker-compose.prod.yml up --build
#
# Exercises the real production images, the standalone Next.js server, the
# Alembic-migration-on-start sequence, the S3 storage backend (against MinIO),
# and the frontend->backend wiring, all offline. ENVIRONMENT is "development"
# so the deploy-safety gate does not demand real hostnames / OpenAI / Sentry;
# that gate is covered by backend/tests/test_config.py and by the real staging
# deploy.

name: ledgerdrop-prod-like

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledgerdrop
      POSTGRES_PASSWORD: ledgerdrop
      POSTGRES_DB: ledgerdrop
    volumes:
      - ledgerdrop_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerdrop -d ledgerdrop"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ledgerdrop
      MINIO_ROOT_PASSWORD: ledgerdrop-secret
    ports:
      - "9001:9001"
    volumes:
      - ledgerdrop_prod_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 ledgerdrop ledgerdrop-secret &&
        mc mb --ignore-existing local/ledgerdrop-uploads &&
        mc anonymous set none local/ledgerdrop-uploads

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: development
      DEBUG: "false"
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://ledgerdrop:ledgerdrop@db:5432/ledgerdrop
      CORS_ALLOW_ORIGINS: http://localhost:3000
      TRUSTED_HOSTS: "*"
      STORAGE_BACKEND: s3
      S3_BUCKET: ledgerdrop-uploads
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ledgerdrop
      S3_SECRET_ACCESS_KEY: ledgerdrop-secret
      EXTRACTION_PROVIDER: fake
    command:
      - sh
      - -c
      - "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  ledgerdrop_prod_pgdata:
  ledgerdrop_prod_minio:
